<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Only For You ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Poppins', sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
text-align:center;
}

/* Background image */
.background{
position:fixed;
width:100%;
height:100%;
background:url("background.png") no-repeat center center/cover;
z-index:-3;
}

/* Dark overlay */
.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-2;
}

/* Content */
.container{
width:90%;
max-width:500px;
animation:fade 1s ease;
}

h1{
font-size:28px;
margin-bottom:20px;
}

p{
font-size:16px;
margin-bottom:25px;
opacity:0.9;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
margin:10px;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

.yes{
background:#ff4e88;
color:white;
box-shadow:0 0 20px #ff4e88;
}

.no{
background:#444;
color:white;
position:absolute;
}

button:hover{
transform:scale(1.1);
}

/* Emoji flying */
.emoji{
position:absolute;
font-size:25px;
animation:floatUp 6s linear infinite;
opacity:0.8;
}

@keyframes floatUp{
0%{transform:translateY(100vh);opacity:0;}
50%{opacity:1;}
100%{transform:translateY(-10vh);opacity:0;}
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="container">
<h1>I’m really sorry ❤️</h1>
<p>
Tumhe lagta hai shayad main tumhari baaton ki value nahi karta…
Par sach ye hai — main karta hoon. Bohot karta hoon.
Bas express karne me weak hoon.
</p>

<button class="yes" onclick="accept()">Give me one chance 💖</button>
<button class="no" id="noBtn" onmouseover="moveBtn()">Still angry 😒</button>
</div>

<!-- Music -->
<audio autoplay loop>
<source src="song.mp3" type="audio/mpeg">
</audio>

<script>

// Move No button
function moveBtn(){
let btn=document.getElementById("noBtn");
btn.style.left=Math.random()*(window.innerWidth-120)+"px";
btn.style.top=Math.random()*(window.innerHeight-60)+"px";
}

// Final page
function accept(){
document.body.innerHTML=`
<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:black;color:white;font-size:26px;text-align:center;padding:20px;">
💖 Thank you… I promise I’ll value every word you say. Always.
</div>`;
}

// Flying emojis generator
const emojis=["💖","✨","🦋","🌸"];
setInterval(()=>{
let emoji=document.createElement("div");
emoji.className="emoji";
emoji.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];
emoji.style.left=Math.random()*100+"vw";
emoji.style.animationDuration=(Math.random()*4+4)+"s";
document.body.appendChild(emoji);
setTimeout(()=>{emoji.remove()},6000);
},400);

</script>

</body>
</html>
